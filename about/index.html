<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>About | GOMSOFT</title>
</head>
<body>
  <div id="siteHeader"></div>

  <header class="page-hero">
    <div class="hero-aurora" aria-hidden="true">
      <span class="hero-aurora-layer hero-aurora-layer--cyan"></span>
      <span class="hero-aurora-layer hero-aurora-layer--blue"></span>
      <span class="hero-aurora-layer hero-aurora-layer--purple"></span>

    <div class="container">
      <h1>About</h1>
      <p>회사 소개 · 대표 · 역량 · 비전</p>

  <div id="aboutContent"></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/project-types.js"></script>
  <script src="/assets/js/post-links.js"></script>

  <script>
    document.getElementById("siteHeader").innerHTML = renderSiteHeader("about");
    document.getElementById("siteFooter").innerHTML = renderSiteFooter();
    document.getElementById("aboutContent").innerHTML = renderAboutPageContent();
    initRevealOnScroll();
    initAboutBusinessStats();
    setPageMeta({
      title: "About",
      description: "GOMSOFT — 아이디어를 실제 서비스로 구현하는 디지털 프로덕트 스튜디오. 대표 허구슬 소개.",
      path: "/about/",
    });
    initNavigation();
  </script>
</body>
</html>
