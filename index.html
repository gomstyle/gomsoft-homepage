<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="naver-site-verification" content="7b83a0f41e36d6a4bb2c41cdb9a847f9651355a8">
  <meta name="description" content="GOMSOFT — Goal Oriented Maker. 아이디어를 실제 서비스로 구현하는 디지털 프로덕트 스튜디오.">
  <meta property="og:title" content="GOMSOFT | 디지털 프로덕트 스튜디오">
  <meta property="og:description" content="우리는 아이디어를 실제 서비스로 만듭니다.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gomsoft.kr/">
  <meta property="og:image" content="https://gomsoft.kr/gomsoft_logo.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://gomsoft.kr/">
  <link rel="preload" href="/assets/fonts/pretendard/Pretendard-Regular.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/pretendard/Pretendard-Bold.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/main.css">
  <title>GOMSOFT | 디지털 프로덕트 스튜디오</title>
</head>
<body>
  <div id="siteHeader"></div>

  <section class="hero" id="homeHero">
    <div class="hero-inner">
      <div class="hero-logo">
        <img src="/assets/images/gomsoft-logo.png" alt="GOMSOFT" decoding="async">
      </div>
      <p class="hero-eyebrow" id="heroEyebrow"></p>
      <h1 id="heroHeadline"></h1>
      <p class="hero-lead" id="heroLead"></p>
      <p class="hero-support" id="heroSupport"></p>
    </div>
  </section>

  <section class="section section-alt home-projects-section">
    <div class="container">
      <div class="section-header">
        <h2>Projects</h2>
        <p>최신 프로젝트 소식</p>
      </div>
      <div id="projectsPreview">
        <div class="empty-state"><p>불러오는 중…</p></div>
      </div>
      <p class="section-footer-link">
        <a href="/projects/">전체 프로젝트 보기 →</a>
      </p>
    </div>
  </section>

  <div id="companyProfile"></div>

  <section class="cta-band">
    <h2>지원사업 · 협업 · 투자 문의</h2>
    <p>사업계획서·회사소개 자료 요청 및 파트너십 제안을 환영합니다.</p>
    <a href="/contact/" class="btn btn-primary">Contact</a>
  </section>

  <div id="siteFooter"></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/project-types.js"></script>
  <script src="/assets/js/post-links.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/posts.js"></script>
  <script>
    document.getElementById("siteHeader").innerHTML = renderSiteHeader("home");
    document.getElementById("siteFooter").innerHTML = renderSiteFooter();
    const homeHero = document.getElementById("homeHero");
    if (homeHero) homeHero.insertAdjacentHTML("afterbegin", renderHeroAuroraMarkup());
    initHomePage();
    initNavigation();
    initHomeProjectsPreview();
    initHomeCompanyOverview();
  </script>
</body>
</html>
