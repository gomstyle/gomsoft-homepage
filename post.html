  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta name="description" content="곰소프트(GOMSOFT)는 앱, 게임, AI·디지털 미디어, 현장 서비스를 직접 기획·개발·운영하는 독립 개발 스튜디오입니다.">
  <meta property="og:title" content="곰소프트 GOMSOFT | 앱·웹·AI 서비스를 만드는 개발 스튜디오">
  <meta property="og:description" content="아이디어를 앱, 웹, AI 서비스로 구현합니다. 곰소프트 GOMSOFT는 기획부터 개발, 출시와 운영까지 직접 수행하는 독립 개발 스튜디오입니다.">
  <meta property="og:site_name" content="곰소프트 GOMSOFT">
  <link rel="alternate" type="application/rss+xml" title="곰소프트 GOMSOFT RSS" href="https://gomsoft.kr/rss.xml">
  <link rel="stylesheet" href="/assets/css/main.css">
  <title>게시글 | 곰소프트 GOMSOFT</title>
</head>
<body>
  <div id="siteHeader"></div>

  <article class="post-detail">
    <div class="container">
      <header class="post-detail-header">
        <h1 id="postTitle">불러오는 중…</h1>
        <p class="post-detail-meta" id="postDate"></p>
      </header>
      <div id="postCover" class="post-cover" hidden></div>
      <div id="postMediaGallery" class="post-media-gallery-wrap" hidden></div>
      <div class="post-content" id="postContent"></div>
      <div class="post-detail-actions" id="postDetailActions" aria-label="하단 메뉴"></div>
    </div>
  </article>

  <div id="siteFooter"></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/project-types.js"></script>
  <script src="/assets/js/post-links.js"></script>
  <script src="/assets/js/post-media.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/markdown.js"></script>
  <script src="/assets/js/posts.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const category = params.get("category");
    const slug = params.get("slug");

    document.getElementById("siteHeader").innerHTML = renderSiteHeader("projects");
    document.getElementById("siteFooter").innerHTML = renderSiteFooter();
    initNavigation();

    if (!category || !slug) {
      document.getElementById("postTitle").textContent = "잘못된 접근입니다.";
    } else {
      renderPostDetail(category, slug).catch(() => {
        document.getElementById("postTitle").textContent = "게시글을 찾을 수 없습니다.";
        document.getElementById("postContent").innerHTML = "";
      });
    }
  </script>
</body>
</html>
